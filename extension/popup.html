<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chinese Web Translator</title>
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <strong>Chinese Web Translator</strong>
        <span id="state">Off</span>
      </header>

      <label class="switch-row">
        <span>Auto translate</span>
        <input id="enabled" type="checkbox">
      </label>

      <label class="field">
        <span>Direction</span>
        <select id="direction">
          <option value="zh-Hans|en">Chinese -> English</option>
          <option value="en|zh-Hans">English -> Chinese</option>
          <option value="zh-Hans|fr">Chinese -> French</option>
          <option value="fr|zh-Hans">French -> Chinese</option>
        </select>
      </label>

      <label class="field">
        <span>Local server</span>
        <input id="backendUrl" type="url" spellcheck="false">
      </label>

      <div class="buttons">
        <button id="translate" type="button">Translate page</button>
        <button id="restore" type="button" class="secondary">Restore</button>
      </div>

      <p id="status" class="status"></p>
      <a href="options.html" target="_blank" class="options-link">Advanced settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
